var days=[
day("10.22 周四","基础与焊接","3h","从电学基础开始，练出合格焊点",[
topic("d22a","电学最小基础",55,R.base,"知道每项基础概念怎样直接用于检查电路。",["画出5V电源、1kΩ电阻和LED串联回路，标电流方向与GND。","用V=IR估算电流；断电辨认LED、二极管、电解电容和IC方向。"],["能解释电压是两点之间的量，电流需要闭合回路，电压表并联。","估算LED电流约(5-2)/1000=3mA。"],"5V接红色LED时，为什么需要串联电阻？万用表测电压应如何连接？","LED不能直接接理想电源，否则电流可能过大。电阻约束电流；电压表并联在被测两点之间。"),
topic("d22b","安全与直插焊点",125,[R.weld,R.weldv],"PDF看步骤和安全，视频看动作；两者都不讲电路原理。",["准备支架、通风、护目镜和废板；烙铁始终回支架。","练10个焊点：烙铁同时接触焊盘/引脚，送锡润湿后先撤锡，再撤烙铁。","断电后检查焊点牢固、无桥连；用通断档测目标连接。"],["至少8/10个焊点润湿且牢固，无相邻桥连。","无铅焊点可哑光，不能只以光亮评判。"],"锡只粘在引脚上，没润湿焊盘，最可能哪一步没做好？","焊盘和引脚没有同时充分受热。通断蜂鸣只是一项检查，不证明整板安全；还要查相邻网络、极性，并观察阻值是否稳定。")]),
day("10.23 周五","焊接集中完成","8h，含休息","一天完成回字、学号和焊接复检",[
topic("d23a","作业要求与正反面规划",45,[R.weldtask,R.weld],"作业明确交付物；焊接PDF用于规划走线与翻面。",["在纸上按洞洞板孔位画回字、学号；标固定角作为方向基准。","正面放置规划后，画一份反面镜像图；标每段连接的起点和终点。","区分连续铜环板与单孔板，先用万用表确认板型连接方式。"],["翻面后仍能按孔位定位，不把相邻孔误认为自动相连。"],"正面图形朝右的一段线，翻到板背面看会朝哪边？","左右镜像后朝左。先标记固定角和元件面，避免翻面时方向混乱。"),
topic("d23b","回字焊接",120,[R.weldtask,R.weldv],"照作业样式完成回字；视频仅补具体焊法。",["先固定四角，再逐段焊；每一圈完成即断电检查。","按规划用元件脚或绝缘线连线，避免用大锡团跨长距离。","分段测目标线路导通以及本不应相连处的绝缘。"],["回字线条连续，正反面清晰，无桥连、漏焊、松动。"],"为什么分段测，比全部焊完后一次测更容易返修？","分段能把问题范围限制在刚完成部分，故障更容易定位。"),
topic("d23c","学号和照片验收",150,[R.weldtask,R.weld],"完成另一项指定作品，并对照文件提交要求。",["先用纸笔把学号分解成短线段，逐段编号后焊接。","每个数字完成后测通断；剪短引脚并检查桥连。","拍正反面照片，检查能否看清线段、焊点和学号。"],["学号可辨认、连接符合设计；正反面照片齐全。"],"外观完整但某段不通，如何定位？","从不通线段两端开始逐个测焊点，沿路径二分缩小范围；检查断线、虚焊和铜环破损。"),
topic("d24a","返修与质量复检",60,[R.weld,R.weldtask],"和回字、学号任务同一天完成；本专题是正式作品的复检，不额外安排第二天焊接训练。",["列出应连接/不应连接的节点，断电逐项测并记录。","选一处废板练习吸锡带或吸锡器；不得在正式板上反复高温拆焊。","复查焊点润湿、牢固、相邻短路、正反面照片和学号清晰度。"],["正式作品通过导通和相邻隔离检查；如需返修有记录且焊盘无损。"],"测带电容线路先蜂鸣后停止，能立刻认定短路吗？","不能。电容充电可造成瞬时蜂鸣；观察阻值变化并结合网络判断。无铅焊点发灰也不必然是冷焊，要看润湿、裂纹、牢固度和测量。"),
topic("d24b","复做与限时自检",45,[R.weldtask],"短练习用于验证独立规划和检查能力。",["在废板上画并焊一个3×3方框，限时25分钟。","余下时间完成导通、邻线短路和焊点检查。","记录用时、返修点和一条具体防错动作。"],["能独立规划正反面并通过连续性/相邻短路检查。"],"“下次认真一点”是有效防错规则吗？","不是。写成可执行动作，例如“每完成一圈，断电测该圈两端并测相邻圈绝缘”。")]),
day("10.24 周六","仿真起步","8h，含休息","Multisim从零操作并做波形测量",[
topic("d24c","仿真基础：元件、电源、地和仪器",180,[R.msppt,R.ni,R.bili],"先用免费教程补软件操作，再独立完成一个小电路。",["按Multisim培训PPT完成新建工程、放置电阻/LED、设置电源、接地、连线和运行。","搭分压电路，用万用表或探针测输入和输出，写下预期与结果。","放置信号源和示波器，输入1kHz正弦波，调整时基/量程并读周期、Vpp和偏置。"],["不看教程能从空白工程完成放件、设值、供电、接地、运行和测量；保存工程与截图。"],"1kHz信号周期是多少？示波器只显示一条直线优先检查哪三项？","周期1ms。检查仿真是否运行、信号源幅度/偏置和频率、示波器通道/地/量程及时基。"),
topic("d24d","波形参数与测量误差",120,[R.base,R.ni],"将操作练习提高到能读数、说明证据，不涉及超出基础的推导。",["分别测正弦波的周期、频率、最大/最小值和Vpp。","改信号源频率为2kHz，先预测时域周期再仿真验证。","保存截图，写明测量工具、读数和一个误差来源。"],["能用T=1/f互相核验读数；两组截图和计算一致。"],"示波器读出T=0.5ms，对应频率多少？Vpp和峰值有何区别？","f=1/T=2kHz。Vpp=最大值减最小值；峰值是相对参考点的单侧幅值，存在偏置时不能混为一谈。")]),
day("10.25 周日","仿真分级复现","8h，含休息","从RC响应进阶到LM324分级建模和波形验收",[
topic("d25a","RC低通：计算、仿真与变式",130,[["RC充放电与时间常数","https://www.bilibili.com/read/cv15861105/","免费图文：看充放电曲线与τ=RC。"],["RC仿真实验指导","https://www.bilibili.com/read/cv22697661/","免费图文：跟做RC搭建和测量。"],R.base],"只学完成滤波实验所需概念，不要求微积分推导。",["搭R=1.6kΩ、C=100nF的一阶低通，计算τ和fc=1/(2πRC)。","分别输入100Hz、1kHz、10kHz正弦波，测输入/输出Vpp并算幅度比。","只将R加倍，先预测fc和输出变化，再仿真核验。"],["留下计算、3组测量和变式截图；能解释低频较易通过、高频衰减。"],"R=1.6kΩ、C=100nF时fc约多少？","fc≈995Hz；实际读数会受模型和测量误差影响。"),
topic("d25b","LM324作业逐级复现",190,[R.mstask,R.msppt,R.lib],"第二次作业规定LM324AD、±12V、三角波输入和二阶低通输出；培训PPT只教软件操作。",["把原图拆成输入、前级、二阶低通、供电和测点五块，抄录所有元件值。","按级搭建，每加一级就测输入/输出，定位异常首次出现的位置。","记录各级频率、Vpp、最大/最小值和偏置；一次只改一个疑点。"],["完整工程可运行；各级截图和测量表齐全；至少3条排错记录。"],"低通前正常、低通后削顶，先查哪几类？","低通接法/元件值、级间连接和负载、运放供电及输出摆幅。"),
topic("d25c","运放最低理论与失真验证",100,[R.base,["负反馈、虚短与放大电路图文","https://blog.csdn.net/qq_36823004/article/details/124542999","免费基础文章：只看同相/反相端、负反馈、线性区与饱和。"]],"先认端口和反馈；不要求完整模电课程，但必须知道虚短的使用条件。",["在作业图标出+、−、输出、电源和反馈路径，说明每级作用。","搭增益约2的同相放大器，先手算再测量。","逐步增大输入直到削顶，记录失真与电源轨的关系。"],["手算和仿真增益相符；能说明饱和时为何不能继续套理想增益。"],"虚短在什么情况下不能盲用？","运放饱和、反馈失效、超出共模/输出范围或受带宽和压摆率限制时。")]),
day("10.26 周一","运放仿真","3h","按第二次作业的真实电路图复现波形",[
topic("d26a","逐级复现 LM324 双电源波形电路",120,[R.mstask,R.msppt,R.lib],"附件图使用LM324AD和VCC/VEE ±12V；三角波输入，经一级处理后再过二阶低通得到正弦波。PPT只负责软件操作。",["先按附件图核对LM324、VCC=+12V、VEE=-12V、R/C数值、稳压二极管和测试点；不要擅自改成单5V供电。","只运行前一级确认三角波，再接二阶低通观察正弦波。","记录A/B通道频率、Vpp、偏置和异常；削顶先查供电与摆幅。"],["A为三角波、B为近似正弦且同频；供电、地和测试点在截图中可辨认。"],"为什么不能用单个5V电源直接照搬这张作业图？输出削顶先查什么？","图中明确给出VCC/VEE正负12V，单5V会改变工作范围和偏置。先查双电源极性/数值、输入幅度、反馈参数和输出摆幅。"),
topic("d26b","理解负反馈的最低限度",60,[R.mstask,R.base],"只学看懂本作业所需概念，不推演完整运放理论。",["在图上标+、−输入、输出和电源脚。","指出反馈路径与每级输入/输出；电源脚不可当信号脚。","写下每一级“输入波形→输出波形”的作用。"],["能指出测试点对应哪一级，不把输入脚当电源脚。"],"运放的“虚短”指两输入脚之间真的接了一根导线吗？","不是。负反馈正常工作时两输入电压近似相等，但并未用导线短接。")]),
day("10.27 周二","仿真A卷","3h","限时复现、参数变式和故障诊断",[
topic("d27a","仿真A卷正式计时",120,[R.mstask,R.msppt],"限时自测页提供题面和折叠标准；可看电路图与手册，不看旧工程或步骤教程。",["90分钟内从空白复现LM324双电源波形作业，测输入/输出频率、Vpp和偏置。","30分钟完成指定参数变化及单处故障定位，写测点与理由。","到点停手，保存计时版，另存修正版。"],["按100分表自评，目标≥85；低于75列入补救；计时版和修正版分开保存。"],"为什么不能只保存最后修好的工程？","计时版反映现场能力，修正版用于学习，两者用途不同。"),
topic("d27b","单变量实验",70,[R.mstask],"训练先预测、后测量的方式。",["复制工程，只把一个指定R或C改成两倍。","先写预测，再运行测量并记录差异。","恢复原值，检查是否有其他误改。"],["记录原值/新值/预测/结果四项，不以猜测代替解释。"],"一次改多个元件为什么不利于排错？","输出变化不能归因到某一个改动，实验结论不清楚。")]),
day("10.28 周三","三极管与双闪","3h","入门三极管、RC，再仿真培训双闪",[
topic("d28a","看懂三极管与极性",55,[R.mstask,R.base],"基础卡讲极性与RC；确切引脚需查器件型号。",["在作业图上标出电源、地、LED、电容和三极管。","查实际型号的E/B/C排列和封装方向；不要把所有TO-92当成同一引脚顺序。","理解三极管在该电路中用于控制支路导通。"],["能从器件资料核对E/B/C，不凭外形猜。"],"同为TO-92封装的三极管，引脚排列是否必然一致？","不一致。按完整型号与数据手册确认，并核对实际朝向。"),
topic("d28b","按9013双闪图仿真并做变式",125,[R.mstask,R.msppt,R.lib],"附件图明确使用9013、R1/R4=220Ω、R2/R3=100kΩ、C1/C2=47µF和+5V；基础卡只补RC时间尺度。",["先核对+5V、GND、LED极性、9013的E/B/C和电解电容正负。","按图运行，观察两只LED交替闪烁；记录一个周期的大致时间。","复制工程，只把一侧100kΩ或47µF改为2倍，先预测再比较，随后恢复。"],["原图稳定交替至少10个周期；变式记录原值、新值、预测和结果。"],"附件图的R2/R3和C1/C2分别是多少？一侧47µF换成94µF会怎样？","R2/R3=100kΩ，C1/C2=47µF；一侧C加倍会使该侧时间尺度变大，通常对应节奏变慢，实际以仿真观察为准。")]),
day("10.29 周四","PCB起步与封装审查","3h","由原理图读网表，练封装核对和局部布局",[
topic("d29a","按9013双闪电路做PCB分块挑战",155,[R.mstask,R.pcbppt,R.eda],"将培训双闪原理图转成小PCB，训练网络、封装、极性与布局。",["不抄现成PCB。按9013双闪原理图列元件清单和网络表，区分+5V、GND及两侧交叉耦合支路。","为9013、LED、电解电容、电阻和电源接口选择封装，核脚序、极性和实物尺寸；不确定时查确切料号手册。","先放接口与功能模块，再预布电源/地和关键网络，运行ERC/DRC并逐网检查。"],["原理图与PCB网络一致；封装/焊盘编号和方向均有依据；无未布网络及未解释DRC错误；留下工程与检查表。"],"只看封装外形相同，为什么仍不能认定脚位正确？","封装只是焊盘几何，符号引脚映射仍可能错误；要核对数据手册焊盘号与实际E/B/C或极性。")]),
day("10.30 周五","双闪实体与PCB","8h，含休息","半天焊接验收，半天三路电源原理图与封装",[
topic("d30a","双闪板集中实作与排故",210,[R.mstask,R.weld,R.weldv],"用原版+5V双闪图，不改变培训要求；规划、焊接、验收合在半天。",["30分钟画洞洞板正反面孔位图，标固定角、节点、极性和实际9013脚序。","130分钟分段焊接，每段完成后断电测通断、邻线短路和极性。","50分钟断电复检后限流+5V上电；测关键节点，稳定交替至少2分钟。","到点仍失败则保存照片、读数和故障假设，余下补弱时间处理，不挤占PCB主线。"],["原版实物、正反面照片、供电/关键点读数齐全；异常发热立即断电；没有故障时记录已排除风险，不编造排故。"],"一只灯常亮、一只不亮，先做什么？","断电比较两侧极性、脚位、RC和网络；无异常短路后限流上电比较基极/集电极等对应节点。"),
topic("d30b","三路电源逐网录入与封装核对",150,[R.pcbt,R.pcbppt,R.pcbv,R.eda],"原图含LM317可调、LM7805的5V、由5V支路供电的AMS1117-3.3V。按原图，不抄成品PCB。",["按三个输出支路分块录入，保留保护二极管、滤波电容、LED和接口。","建立封装表：确切料号、引脚号、网络、实物尺寸、封装及方向。LM317/7805不能因外形相同就共用脚序假设。","AMS1117常见SOT-223；确认实际物料和转接/焊接方案，不把所有器件硬改成直插。","运行ERC并逐网核输入、地、输出及同名标签；有疑问列清单后查手册。"],["三路电气关系正确，所有器件封装有依据；未解决问题能定位到具体引脚/手册。"],"同名网络标签可能带来哪种隐藏错误？","误用同名标签会把本不应连接的节点连在一起，必须用网络高亮/网络表核对。"),
topic("d30c","模块布局与功耗初查",60,[R.pcbt,R.eda,["TI LM317原厂手册","https://www.ti.com/lit/ds/symlink/lm317.pdf","只查引脚、典型反馈电路、压差与散热；不通读。"]],"软件会操作只是起点，要能解释接口、回流和器件限制。",["板框≤100×100mm；接口放板边，按三路分区，预留接线和大器件空间。","把相关电容靠近对应器件，安排地回路，标可调/5V/3.3V/GND。","用P≈(Vin−Vout)Iout估算12V→5V、100mA稳压器功耗，查手册说明还需哪些热设计信息。"],["布局图和一页风险表：封装、极性、接口、功耗各有结论。"],"12V线性降到5V、100mA，约耗散多少？","约0.7W。额定电流不代表一定不用散热，温升还取决于热阻、环境和散热条件。")]),
day("10.31 周六","PCB完整交付与A卷","8h，含休息","完成培训板全流程，再从空白限时复现",[
topic("d31a","三路稳压板布线与制造检查",230,[R.pcbt,R.pcbppt,R.eda],"先做完整闭环；DRC是必要检查之一，还要人工核对功能。",["按电流、铜厚、板厂能力设规则；完成布线、铺铜，检查电源地与回流。","核无未布网络，逐网追踪输入、地、三路输出和AMS1117来自5V的供电路径。","运行DRC并逐项处理；丝印避焊盘，输出/极性/1脚清楚。","导出工程、BOM、Gerber和检查结果；预览板框、钻孔、铜层、阻焊、丝印。"],["工程可重新打开，无未解释DRC错误或未布网络；拓扑/封装/方向的人工检查表齐全。"],"Gerber导出成功是否证明能正常工作？","不能；拓扑、参数、脚位映射、负载和装配都要核验。"),
topic("d31b","PCB A卷正式计时",150,[R.pcbt],"按限时自测页A卷做；提供原理图和已核物料清单，不提供布局与旧工程。",["从独立空白工程计时150分钟，不能复制旧PCB布局/布线。","完成三路电源板，交付工程、DRC、封装表、Gerber审查结果。","到点保留未完成版，说明剩余网络/问题和修复顺序。"],["按100分表自评，目标≥85；无电源/极性/脚序致命错；查资料次数如实记录。"],"布局与示例不同必然扣分吗？","不必。按网络、装配/制造、功能分区与回流、可读性、验证证据评分。"),
topic("d31c","A卷复盘",40,[R.eda],"用失分决定补课，而非重新看全部教程。",["统计分数和帮助次数，选2项最大失分。","各做一次局部修复，把原因写成具体防错步骤。"],["两项问题均有证据、原因和复做结果。"],"限时版不完整应删除吗？","不应，保留可比较时间管理和真实完成度。")]),
day("11.1 周日","仿真与PCB陌生B卷","8h，含休息","从指标选参数，从文字需求设计小板",[
topic("d01a","仿真B卷：指标反推设计",120,[R.base,R.ni],"限时自测页B卷只给输入输出指标与公式，不给成品图；用已学同相放大和RC组合。",["先算增益、电阻比与截止频率，再从空白搭建。","测100Hz/1kHz/10kHz传输比，并检验摆幅及一项故障。","保存计算、工程、读数、失败尝试与3分钟解释。"],["计算和仿真验收相互对应，目标≥85分；不靠盲调凑波形。"],"串联两个单独正确的模块，整体一定正确吗？","不一定；级间负载、阻抗、供电和摆幅会影响整体，要测各级和整体。"),
topic("d01b","PCB B卷：陌生低压接口板",150,[R.eda],"限时自测页B卷含5V→3.3V、双电源指示、传感器接口、分压/RC、测试点和制造约束。",["先写接口表、网络表、器件清单与验收表，再画原理图。","核确切型号、封装/脚序，完成≤60×50mm双层板布局布线、DRC和导出。","到点保存限时版，口述供电、接口方向、滤波与检查依据。"],["覆盖全部需求，工程与手册依据可查，目标≥85分。"],"只给文字需求与照图相比，多了哪些判断？","要自己拆需求、选拓扑/参数、定义接口、建立网络，并决定怎样验证。"),
topic("d01c","B卷纠错与边界挑战",150,[R.base,R.eda],"前90分钟复盘必做；后60分钟先补未达75的主卷，均达75再做提高题，时间不额外增加。",["逐项评分，优先修电源/网络/封装，再补缺失测量与文档。","最大失分任务关资料独立重做，写4条症状—测点—判断规则。","达门槛后做仿真C准备：比较同相放大→RC与RC→同相放大的加载差别；再改变输入幅度找线性边界。"],["有独立复做证据；C题未做清楚写未做，不用熬夜补时。"],"提高题失败是否证明所有基础都不会？","不是；把故障定位到模块/条件，先确保基本设计和验证链完整，再补该边界知识。")]),
day("11.2 周一","仿真故障专题","3h","区分电路失真、参数错误和仪器假象",[
topic("d02a","LM324多故障逐点定位",105,[R.mstask,R.ni,["TI LM324原厂手册","https://www.ti.com/lit/ds/symlink/lm324.pdf","查实际型号引脚、共模范围、输出摆幅、带宽/压摆率，不通读。"]],"只在仿真副本注入故障。自设故障不等于盲测，可隔天打乱文件名后再诊断。",["建基准及三份副本，分别改单处断线、某R错误一个数量级、输入幅度过大。","每题限时20分钟：写症状、首测点和假设，再沿各级波形找首次异常。","恢复后测频率/Vpp/偏置，说明为什么排除另外两个原因。"],["3题至少定位2题；保存修前修后波形和因果说明，不靠乱改。"],"削顶和示波器量程过小怎样区分？","扩大显示量程并看数值，测前后级和电源轨，确认真实波形是否贴轨。"),
topic("d02b","陌生频率与器件边界",60,[R.mstask,R.base],"查资料是为解释测量结果，型号不明确时写清不确定项。",["做半页LM324AD速查卡：电源、引脚、共模/输出范围及反馈条件。","改输入频率，比较输出幅度和形状；从手册、滤波特性和仪器三方面排查。"],["至少一组数据能支持解释，能区分电源限制、滤波衰减和测量错误。"],"仿真跑通保证实物相同吗？","不能，模型、容差、供电、负载、布线和仪器会造成差别。")]),
day("11.3 周二","PCB需求变式与审图","3h","变更需求后同步设计，核查规则之外的功能错误",[
topic("d03a","PCB B卷变式：电流和接口改变",110,[R.eda,R.pcbppt],"沿用B卷供电结构，LED目标电流改为1mA，增加一个三针接口及测试点。",["列变更影响：元件、参数、网络、封装、板边空间和丝印。","重算5V/3.3V两支路LED电阻，按实际LED压降选常见阻值；更新原理图到PCB。","核差异列表与网络，完成重布、ERC/DRC、Gerber预览，保留改前版。"],["新增需求有验收证据，无旧飞线/错误网络残留；电阻选择有计算。"],"原理图改完后PCB导出前还做什么？","同步到PCB、核差异和网络，再查封装/布线、DRC与制造文件。"),
topic("d03b","五项人工审图",55,[R.pcbt,R.eda],"DRC无法替代按手册和需求审查。",["逐项核稳压器脚序、AMS1117输入来自5V、同名网络、连接器方向、LED/电容极性。","每项写证据、潜在症状和定位测点；发现问题修正后再检查。"],["5项均有结论；没有真实错误就记录已核风险，不能编造。"],"标5V的接口实际接到3.3V，DRC通常能查出吗？","通常不能，必须对照需求、网络和丝印人工核对。")]),
day("11.4 周三","跨模块限时诊断","3h","仿真陌生变式与PCB纠错同轮计时",[
topic("d04a","仿真陌生参数小卷",90,[R.mstask,R.base],"使用已学拓扑，改变输入频率/幅度或RC；测试迁移能力，不背原数值。",["抽A/B卷最弱一题，先预测fc/增益/波形变化，再从空白搭建。","在副本模拟反馈断线或测点错误，20分钟内定位并用读数解释。","记录所有帮助和超时，保留工程、测量表和波形。"],["指标有计算与实测，故障修复可复现。"],"频率升高幅度变小，直接增大源幅度合理吗？","先核滤波特性、测点和器件限制；直接补幅可能掩盖原因。"),
topic("d04b","PCB局部重画与审查",75,[R.pcbt,R.eda],"以三路稳压板/B卷为题库，不再焊简单LED。",["抽一个输出支路，从文字需求重画，限时35分钟核接线、封装和极性。","40分钟更新PCB并检查输入/地/输出/接口、未布网络和DRC。"],["支路与接口定义正确，检查证据完整；能指出软件检查不到的一项风险。"],"原理图交叉的两条线怎样确认是否相连？","查连接点、网络高亮或网络表，不能只凭视觉交叉。")]),
day("11.5 周四","边界分析与答辩","3h","练不熟题的拆解、验证和过程表达",[
topic("d05a","七步方案与四个追问",90,[R.mstask,R.pcbt,R.base],"未知项声明假设，说明该假设如何影响设计；不假装知道。",["用需求→指标→拓扑→计算/选型→搭建→测量→排错写一页方案。","录3分钟讲供电、测点、预期、实际和首查原因。","回答输入翻倍、负载增大、封装替换、DRC通过为何仍可能坏四个追问，各给证据或查证方向。"],["四问都有推理路径；缺负载电流等条件能指出其影响。"],"题目没给负载电流，怎样选线宽与稳压器？","说明该条件影响功耗、压差、温升与线宽；请求条件或声明合理假设，并列需确认项。"),
